<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2325D366'/%3E%3Cstop offset='1' stop-color='%23075E54'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%230B141A' fill-opacity='0.85'/%3E%3Cpath d='M32 22c-8 0-8 0-8 10s0 10 8 10 8 0 8-10' fill='none' stroke='%2325D366' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='m24 38 5 6 10-14' fill='none' stroke='%23DCF8C6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B141A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />
    <meta name="description" content="SatiStudy — your cheerful AI study companion. Plan tasks, track exams, analyse weak topics and stay motivated." />
    <title>SatiStudy — Sati Vidisha Study Companion</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('satistudy-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
